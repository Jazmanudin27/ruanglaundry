<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drum / Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Gold Sparkle Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Water Wave Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="1" />
    </linearGradient>

    <!-- Glow Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#cardShadow)" />

  <!-- Outer Neon Accent Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />

  <!-- Background Decorative Water Ripple Rings -->
  <circle cx="256" cy="230" r="185" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 8" />
  <circle cx="256" cy="230" r="150" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.1" />

  <!-- Washing Machine Drum Rim -->
  <circle cx="256" cy="226" r="126" fill="#0b1e33" stroke="url(#ringGrad)" stroke-width="14" filter="url(#glow)" />
  <circle cx="256" cy="226" r="114" fill="#081524" />

  <!-- Drum Glass Reflection / Inner Shimmer -->
  <path d="M 170 180 A 114 114 0 0 1 330 160 A 114 114 0 0 0 170 180 Z" fill="#ffffff" fill-opacity="0.12" />

  <!-- Water Waves Inside Drum -->
  <g clip-path="url(#drumClip)">
    <clipPath id="drumClip">
      <circle cx="256" cy="226" r="110" />
    </clipPath>
    <!-- Wave Layer 1 -->
    <path d="M 130 240 Q 190 270 256 240 T 382 240 L 382 340 L 130 340 Z" fill="#0369a1" opacity="0.6" />
    <!-- Wave Layer 2 -->
    <path d="M 130 252 Q 190 225 256 255 T 382 250 L 382 340 L 130 340 Z" fill="url(#waterGrad)" />
    <!-- Bubbles -->
    <circle cx="210" cy="235" r="7" fill="#ffffff" opacity="0.6" />
    <circle cx="295" cy="245" r="9" fill="#ffffff" opacity="0.5" />
    <circle cx="245" cy="265" r="5" fill="#ffffff" opacity="0.7" />
    <circle cx="185" cy="275" r="4" fill="#ffffff" opacity="0.6" />
    <circle cx="320" cy="270" r="6" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Central Stylized Monogram: BWL -->
  <g id="BWL-Monogram" filter="url(#glow)">
    <!-- Main BWL Text in bold geometric typography -->
    <text x="256" y="244" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, Roboto, sans-serif" font-size="78" font-weight="900" text-anchor="middle" letter-spacing="4" fill="#ffffff">
      BWL
    </text>
    <!-- Sub-tagline inside drum -->
    <text x="256" y="272" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="3" fill="#38bdf8">
      BASMALAH WASH
    </text>
  </g>

  <!-- Sparkles / Berkah Stars -->
  <!-- Top Right Sparkle -->
  <path d="M 390 105 Q 390 125 410 125 Q 390 125 390 145 Q 390 125 370 125 Q 390 125 390 105 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <!-- Small Star -->
  <path d="M 425 155 Q 425 167 437 167 Q 425 167 425 179 Q 425 167 413 167 Q 425 167 425 155 Z" fill="#38bdf8" />
  <!-- Left Side Sparkle -->
  <path d="M 105 155 Q 105 170 120 170 Q 105 170 105 185 Q 105 170 90 170 Q 105 170 105 155 Z" fill="url(#goldGrad)" />

  <!-- Bottom Brand Banner: BASMALAH WASH LAUNDRY -->
  <g transform="translate(0, 375)">
    <!-- Pill Capsule Background -->
    <rect x="76" y="0" width="360" height="66" rx="33" fill="#0b1b2d" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />
    
    <!-- NFC / RFID Wave Signal Icon on Pill Left -->
    <g transform="translate(100, 18)">
      <path d="M 4 8 A 8 8 0 0 1 4 22" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
      <path d="M 10 3 A 15 15 0 0 1 10 27" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6" />
      <circle cx="0" cy="15" r="3" fill="#38bdf8" />
    </g>

    <!-- Brand Typography -->
    <text x="264" y="29" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, Roboto, sans-serif" font-size="18" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="2.5">
      BASMALAH WASH
    </text>
    <text x="264" y="49" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" fill="#38bdf8" letter-spacing="3">
      LAUNDRY MEMBER RFID
    </text>

    <!-- Small Checkmark / Star on Pill Right -->
    <circle cx="406" cy="33" r="10" fill="#0284c7" />
    <path d="M 402 33 L 405 36 L 411 29" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

